name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest==8.3.3" "pyarrow==21.0.0"
      - name: collect
        run: >-
          python -m pytest -o addopts= --collect-only -q
          tests/unit tests/analytics/test_archive.py tests/analytics/test_reconcile_identity.py
          | tee unit-collected.txt
      - name: test
        run: >-
          python -m pytest -rs tests/unit tests/analytics/test_archive.py tests/analytics/test_reconcile_identity.py
          --junitxml=unit-report.xml
      - name: no skips, collected == executed
        run: >-
          python scripts/check_test_report.py unit-report.xml --collected unit-collected.txt
          --require tests/analytics/test_reconcile_identity.py::test_different_topics_with_identical_empty_state_are_refused
          --require tests/analytics/test_reconcile_identity.py::test_different_topics_with_identical_nonempty_state_are_refused
          --require tests/analytics/test_reconcile_identity.py::test_same_topic_comparison_runs_and_matches
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: unit-*.*

  # One job with the whole stack: Kafka, PostgreSQL, Parquet and Spark together.
  # Every test that needs any of them runs here, so a test carrying several markers
  # cannot fall between jobs. Container-kill tests (stack_kill) are deselected: they
  # need `docker compose kill` on the services, which a GitHub service container does
  # not offer. They run locally only.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: streamledger
          POSTGRES_PASSWORD: streamledger_local_only
          POSTGRES_DB: streamledger
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamledger -d streamledger"
          --health-interval 3s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        env:
          CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://localhost:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports: ["19092:19092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: >-
          pip install "pytest==8.3.3" "pyarrow==21.0.0" "pandas==2.2.3" "pyspark==4.0.1"
          "psycopg[binary]==3.2.10" "confluent-kafka==2.11.1"
      - run: python scripts/migrate.py
      - name: readiness (PostgreSQL schema, Kafka broker, Java, PySpark)
        run: python scripts/wait_ready.py --timeout 120
      - name: collect
        run: python -m pytest -o addopts= --collect-only -q -m "not stack_kill" tests | tee stack-collected.txt
      - name: test
        run: python -m pytest -rs -m "not stack_kill" tests --junitxml=stack-report.xml
      - name: no skips, collected == executed, headline tests passed
        run: >-
          python scripts/check_test_report.py stack-report.xml --collected stack-collected.txt
          --require tests/integration/test_reconcile_e2e.py::test_three_way_reconciliation_and_tamper_detection
          --require tests/analytics/test_spark_reconstruction.py::test_spark_matches_reference_on_generated_archive
          --require tests/integration/test_pipeline.py::test_stream_matches_reference_exactly
          --require tests/recovery/test_crash_windows.py::test_in_process_crash_at_boundary
          --require tests/analytics/test_reconcile_identity.py::test_same_topic_with_damaged_snapshot_reports_classified_difference
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-test-report
          path: stack-*.*
