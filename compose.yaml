# Local-only stack: every published port binds to 127.0.0.1.
# Start:  docker compose up -d --wait     Stop: docker compose down     Wipe data: docker compose down -v
name: streamledger

services:
  kafka:
    image: apache/kafka:3.9.1          # publishes linux/arm64 and linux/amd64
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # One-shot: creates the topic idempotently. Infinite retention so the full log can be replayed.
  # CreateTime: the record timestamp is the (simulated) producer send time; see consistency-contract 4.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic commerce-events --partitions 3 --replication-factor 1
        --config message.timestamp.type=CreateTime --config retention.ms=-1 --config retention.bytes=-1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic commerce-events
    mem_limit: 512m
    restart: "no"

  postgres:
    image: postgres:17.6-alpine        # publishes linux/arm64 and linux/amd64
    environment:
      POSTGRES_USER: streamledger
      POSTGRES_PASSWORD: streamledger_local_only   # throwaway local credential; port is loopback-only
      POSTGRES_DB: streamledger
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250
    ports:
      - "127.0.0.1:55432:5432"     # not 5432, so an existing local PostgreSQL does not clash
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamledger -d streamledger"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  kafka-data:
  pg-data:
